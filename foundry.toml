[profile.default]
src = "contracts"
# Solidity tests live apart from the existing vitest suite in test/*.ts.
test = "test/solidity"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
# createElection takes many parameters; the legacy codegen runs out of stack.
via_ir = true
# QoreChain's support for PUSH0 and transient storage is unverified, so the
# contracts avoid needing either. See docs/VERIFIED-FACTS.md.
evm_version = "paris"
gas_reports = ["Election"]

[rpc_endpoints]
qorechain_diana = "https://evm-testnet.qore.host"

[etherscan]
# explore.qore.network exposes no verification API that has been confirmed.
# Verification status is recorded in PROOF.md rather than assumed.
